[project]
name = "algo-trading-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[tool.pyright]
extraPaths = ["packages", "services/alor-auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages", "services/alor-auth"]

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
]
